name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Upload nuget artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nugets
          path: nugets/*.nupkg

  deploy:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $xml = [xml](Get-Content Directory.Build.props)
          $propsVersion = $xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          Write-Host "Tag version: $tagVersion"
          Write-Host "Directory.Build.props version: $propsVersion"
          if ($tagVersion -ne $propsVersion) {
            Write-Error "Tag version '$tagVersion' does not match Directory.Build.props version '$propsVersion'"
            exit 1
          }

      - name: Download nuget artifacts
        uses: actions/download-artifact@v8
        with:
          name: nugets
          path: nugets

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: tom-englert

      - name: NuGet push
        run: dotnet nuget push nugets\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
